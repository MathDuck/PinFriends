name: Release

# Push a tag like v1.0.0 to publish a release with a zip of the plugin and install scripts
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: zip -r "PinFriends-${GITHUB_REF_NAME}.zip" src scripts docs README.md LICENSE

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "PinFriends-${GITHUB_REF_NAME}.zip" \
            --title "PinFriends ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            --generate-notes
